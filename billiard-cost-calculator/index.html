<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>당구장 원가계산기</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5d6673; --line:#e2e5ea; --pos:#1f7a4d; --neg:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --muted:#9aa3ae; --line:#2d323a; --pos:#4cc38a; --neg:#ff6b5e; }
  }
  :root[data-theme="dark"] { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --muted:#9aa3ae; --line:#2d323a; --pos:#4cc38a; --neg:#ff6b5e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; gap:10px; }
  .row input { width:110px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:15px; text-align:right; }
  .row span.u { color:var(--muted); font-size:13px; width:32px; }
  .row .r { display:flex; align-items:center; gap:6px; }
  .big { text-align:center; padding:6px 0 10px; }
  .big .l { color:var(--muted); font-size:13px; }
  .big .v { font-size:32px; font-weight:800; }
  .pos { color:var(--pos); } .neg { color:var(--neg); }
  .res .row { border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .res .row:last-child { border-bottom:0; }
  label.chk { display:flex; gap:8px; align-items:center; padding-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎱 당구장 원가계산기</h1>

  <div class="card">
    <div class="row"><span>월 매출</span><span class="r"><input id="rev" type="number" value="700"><span class="u">만원</span></span></div>
    <div class="row"><span>월세</span><span class="r"><input id="rent" type="number" value="180"><span class="u">만원</span></span></div>
    <div class="row"><span>세금</span><span class="r"><input id="tax" type="number" value="200"><span class="u">만원</span></span></div>
    <div class="row"><span>인건비 (1명, 13시간×30일, 최저시급)</span><span class="r"><input id="labor" type="number" value="402.5" step="0.1"><span class="u">만원</span></span></div>
    <div class="row"><span>천갈이 (다이당 70만 × 18대 ÷ 8년)</span><span class="r"><input id="cloth" type="number" value="13.1" step="0.1"><span class="u">만원</span></span></div>
    <div class="row"><span>권리금</span><span class="r"><input id="premium" type="number" value="5000"><span class="u">만원</span></span></div>
    <label class="chk"><input id="owner" type="checkbox"> 사장 직접 근무 (인건비 0)</label>
  </div>

  <div class="card">
    <div class="big"><div class="l">월 순이익</div><div class="v" id="profit"></div></div>
    <div class="res">
      <div class="row"><span>월 비용 합계</span><b id="cost"></b></div>
      <div class="row"><span>손익분기 매출</span><b id="bep"></b></div>
      <div class="row"><span>연 순이익</span><b id="year"></b></div>
      <div class="row"><span>권리금 회수 기간</span><b id="payback"></b></div>
    </div>
  </div>
  <p style="color:var(--muted);font-size:12px;margin:0">보증금 3,000만원은 돌려받는 돈이라 비용에서 제외. 전기·관리비는 미반영.</p>
</div>
<script>
  const $ = id => document.getElementById(id);
  const n = id => parseFloat($(id).value) || 0;
  const fmt = v => (Math.round(v * 10) / 10).toLocaleString("ko-KR") + "만원";
  function calc() {
    const labor = $("owner").checked ? 0 : n("labor");
    const cost = n("rent") + n("tax") + labor + n("cloth");
    const profit = n("rev") - cost;
    $("profit").textContent = fmt(profit);
    $("profit").className = "v " + (profit >= 0 ? "pos" : "neg");
    $("cost").textContent = fmt(cost);
    $("bep").textContent = fmt(cost);
    $("year").textContent = fmt(profit * 12);
    $("year").className = profit >= 0 ? "pos" : "neg";
    const m = profit > 0 ? n("premium") / profit : Infinity;
    $("payback").textContent = isFinite(m) ? (m >= 12 ? Math.floor(m / 12) + "년 " + Math.round(m % 12) + "개월" : Math.ceil(m) + "개월") : "회수 불가 (적자)";
  }
  document.querySelectorAll("input").forEach(i => i.addEventListener("input", calc));
  calc();
</script>
</body>
</html>
